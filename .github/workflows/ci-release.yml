name: CI - Release Branch

on:
  pull_request:
    branches:
      - master

jobs:
  verify-version:
    name: Verify Version Tag Is Available
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Check version tag is not yet taken
        run: |
          VERSION="v$(cat VERSION.txt)"
          if git ls-remote --tags origin "${VERSION}" | grep -q "${VERSION}"; then
            echo "ERROR: Tag ${VERSION} already exists. Bump VERSION.txt (and .claude-plugin/plugin.json's version to match) before merging to master."
            exit 1
          fi
          echo "Tag ${VERSION} is available."

      - name: Check plugin.json version matches VERSION.txt
        run: |
          VERSION=$(cat VERSION.txt)
          PLUGIN_VERSION=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "ERROR: VERSION.txt ($VERSION) and .claude-plugin/plugin.json's version ($PLUGIN_VERSION) don't match."
            exit 1
          fi

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r env/requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

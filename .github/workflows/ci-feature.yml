name: CI - Feature Branch

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'REL/**'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r env/requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v
